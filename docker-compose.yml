services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowcommerce
      POSTGRES_USER: flowcommerce
      POSTGRES_PASSWORD: flowcommerce
      TZ: Indian/Antananarivo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowcommerce -d flowcommerce']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      PORT: 8080
      DATABASE_URL: postgres://flowcommerce:flowcommerce@postgres:5432/flowcommerce
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
